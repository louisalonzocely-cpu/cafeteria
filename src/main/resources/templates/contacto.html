<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Contacto</title>
  <link rel="stylesheet" href="/css/cafeteria.css">
</head>
<body>
  <h1 th:text="${titulo}">Contacto</h1>

  <form class="formulario" th:action="@{/contacto}" method="post">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" th:value="${nombre}" required>

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" th:value="${correo}" required>

    <label for="asunto">Asunto</label>
    <input type="text" id="asunto" name="asunto" th:value="${asunto}" required>

    <div class="acciones">
      <button type="submit" class="boton">Enviar</button>
      <a th:href="@{/menu}" class="boton secundario">Volver al menú</a>
    </div>
  </form>

  <div class="modal-fondo" th:if="${enviado}">
    <div class="modal">
      <h2>Mensaje enviado</h2>
      <p><strong>Nombre:</strong> <span th:text="${nombre}">Nombre</span></p>
      <p><strong>Correo:</strong> <span th:text="${correo}">Correo</span></p>
      <p><strong>Asunto:</strong> <span th:text="${asunto}">Asunto</span></p>
      <a class="boton" th:href="@{/contacto}">Cerrar</a>
    </div>
  </div>
</body>
</html>
